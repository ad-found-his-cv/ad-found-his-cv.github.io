<html lang="en">
<head>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
					
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body, html {
            background-color: #141414; 
            min-height: 100vh;
            overflow: hidden; 
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            color: #fff;
        }

        .screen {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            display: none; opacity: 0; transition: opacity 0.8s ease-in-out;
        }
        .screen.active { display: flex; opacity: 1; }

        /* --- 1. NETFLIX PROFILE SCREEN --- */
        #profile-screen { flex-direction: column; justify-content: center; align-items: center; background-color: #141414; z-index: 30; }
        .profile-title { font-size: 3vw; font-weight: 400; margin-bottom: 2.5em; letter-spacing: 2px; text-align: center; }
        .profiles-container { display: flex; gap: 5vw; }
        .profile { display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: transform 0.2s ease; }
        .profile:hover { transform: scale(1.05); }
        .profile:hover .avatar { border-color: #fff; box-shadow: 0 0 20px rgba(255, 255, 255, 0.2); }
        .profile:hover .profile-name { color: #fff; }

        .avatar {
            width: 12vw; height: 12vw; min-width: 110px; min-height: 110px; max-width: 200px; max-height: 200px;
            border-radius: 6px; border: 3px solid transparent; display: flex; justify-content: center; align-items: center;
            transition: all 0.3s ease; background-color: #2b2b2b; overflow: hidden;
        }
        .avatar.groom { background: linear-gradient(to bottom, #30414f 0%, #1e2933 100%); }
        .avatar.bride { background: linear-gradient(to bottom, #d93737 0%, #a61c1c 100%); }
        .avatar svg { width: 100%; height: 100%; }
        .profile-name { margin-top: 15px; color: #808080; font-size: 1.2rem; letter-spacing: 1px; transition: color 0.2s ease; }

        /* --- 2. FLIPBOOK SCREEN --- */
        #flipbook-screen {
            background: linear-gradient(135deg, #b0d892 0%, #ffc4a3 100%);
            z-index: 10;
        }

        .container { width: 100vw; height: 100vh; overflow: auto; }

        #layout-wrapper {
            position: relative; margin: 0 auto; transition: width 0.3s ease-in-out, height 0.3s ease-in-out;
        }

        .zoom-wrapper {
            position: absolute; top: 0; left: 0; transform-origin: top left; transition: transform 0.3s ease-in-out; 
        }

        #newspaper { display: block; width: 100%; height: 100%; }

        /* --- FLIP INDICATOR --- */
        #flip-indicator {
            position: absolute; left: 50%; top: 10%; transform: translate(-50%, -50%);
            display: flex; flex-direction: column; align-items: center; background: rgba(26, 26, 26, 0.85); color: #f6f4ed;
            padding: 12px 20px; border-radius: 30px; font-family: 'Old Standard TT', serif; font-size: 1.2rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.2);
            pointer-events: none; opacity: 0; transition: opacity 0.5s ease; z-index: 50;
            animation: bounceLeft 2s infinite;
        }
        #flip-indicator.visible { opacity: 1; }
        #flip-indicator svg { width: 30px; height: 30px; margin-bottom: 5px; stroke: #f6f4ed; }
        @keyframes bounceLeft { 0%, 100% { transform: translate(-50%, -50%); } 50% { transform: translate(-60%, -50%); } }

        /* --- DYNAMIC OVERLAYS --- */
        #video-play-overlay {
            position: absolute; top: 55%;
            width: 100px; height: 100px; background: rgba(20, 20, 20, 0.9); border: 3px solid #f6f4ed;
            border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer;
            opacity: 0; pointer-events: none; transition: all 0.4s ease; z-index: 20; box-shadow: 0 15px 30px rgba(0,0,0,0.4);
            left: 75%; transform: translate(-50%, -50%) scale(0.8);
        }
        #video-play-overlay.visible { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
        #video-play-overlay:hover { background: #1a1a1a; transform: translate(-50%, -50%) scale(1.1); }
        #video-play-overlay svg { width: 45px; height: 45px; fill: #f6f4ed; margin-left: 6px; }

        #inline-video-container {
            position: absolute; top: 53.5%; height: 48%; 
            background: #000; z-index: 15; opacity: 0; pointer-events: none;
            transition: opacity 0.4s ease; border-radius: 8px; box-shadow: 0 15px 40px rgba(0,0,0,0.5); overflow: hidden;
            left: 75%; width: 33%; transform: translate(-50%, -50%);
        }
        #inline-video-container.playing { opacity: 1; pointer-events: auto; }
        #inline-video-container video { width: 100%; height: 100%; object-fit: contain; display: block; }

        #rsvp-link-overlay {
            position: absolute; top: 88.5%; height: 110px; background: rgba(255, 196, 163, 0.0); 
            border: 2px solid transparent; border-radius: 8px; cursor: pointer;
            opacity: 0; pointer-events: none; transition: all 0.3s ease; z-index: 20;
            display: flex; justify-content: center; align-items: center;
            left: 75%; width: 45%; transform: translate(-50%, -50%);
        }
        #rsvp-link-overlay.visible { opacity: 1; pointer-events: auto; }
        #rsvp-link-overlay:hover { background: rgba(255, 196, 163, 0.2); border: 2px solid #ffc4a3; box-shadow: 0 0 15px rgba(255, 196, 163, 0.5); }
        #rsvp-link-overlay::after {
            content: "Click to RSVP!"; position: absolute; bottom: -40px; background: #1a1a1a;
            color: #f6f4ed; padding: 5px 12px; border-radius: 4px; font-size: 0.9rem;
            opacity: 0; transition: opacity 0.2s ease; pointer-events: none; white-space: nowrap;
        }
        #rsvp-link-overlay:hover::after { opacity: 1; }

        /* PORTRAIT OVERRIDES */
        .is-portrait #video-play-overlay { left: 50%; }
        .is-portrait #inline-video-container { left: 50%; width: 66%; }
        .is-portrait #rsvp-link-overlay { left: 50%; width: 90%; }

        /* --- FULLY RESPONSIVE ELEGANT RSVP MODAL --- */
        #rsvp-modal {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px); z-index: 2000;
            display: none; justify-content: center; align-items: center; opacity: 0; transition: opacity 0.3s ease;
            padding: 15px;
        }
        #rsvp-modal.active { display: flex; opacity: 1; }

        .rsvp-content {
            background: #fdfbf7; color: #1a1a1a; width: 100%; max-width: 550px;
            max-height: 90vh; overflow-y: auto; padding: 35px 30px; position: relative;
            box-shadow: 0 25px 50px rgba(0,0,0,0.7); border: 2px solid #1a1a1a; 
            outline: 1px solid #1a1a1a; outline-offset: -8px; -webkit-overflow-scrolling: touch;
        }

        .close-rsvp {
            position: absolute; top: 15px; right: 20px; background: none; border: none; font-size: 1.5rem;
            color: #1a1a1a; cursor: pointer; transition: transform 0.2s ease; z-index: 10;
        }
        .close-rsvp:hover { transform: scale(1.2); }

        .rsvp-content h2 {
            font-family: 'Playfair Display', serif; font-size: 2rem; margin-bottom: 20px;
            text-align: center; text-transform: uppercase; letter-spacing: 2px;
            border-bottom: 1px solid #1a1a1a; padding-bottom: 12px;
        }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 6px; font-family: 'Playfair Display', serif; font-style: italic; font-size: 1.05rem; }
        .form-group input { width: 100%; padding: 10px 12px; border: 1px solid #b3b3b3; background: #fff; font-family: 'Old Standard TT', serif; font-size: 1rem; transition: all 0.3s ease; }
        .form-group input:focus { border-color: #ffc4a3; box-shadow: 0 0 8px rgba(255, 196, 163, 0.6); outline: none; }

        .radio-group { display: flex; gap: 20px; margin-top: 5px; }
        .radio-group label { font-family: 'Old Standard TT', serif; font-size: 1rem; display: flex; align-items: center; gap: 6px; cursor: pointer; }
        
        .checkbox-group { display: flex; align-items: center; gap: 10px; margin-top: 15px; margin-bottom: 20px; cursor: pointer;}
        .checkbox-group label { margin-bottom: 0; cursor: pointer; font-size: 1rem; font-family: 'Old Standard TT', serif;}

        .submit-btn {
            width: 100%; padding: 14px; background: #1a1a1a; color: #fdfbf7; border: 1px solid #1a1a1a; 
            font-family: 'Playfair Display', serif; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 2px;
            cursor: pointer; transition: all 0.3s ease; margin-top: 5px;
        }
        .submit-btn:hover { background: #ffc4a3; color: #1a1a1a; }

        .form-row { display: flex; gap: 15px; }
        @media (max-width: 600px) {
            .form-row { flex-direction: column; gap: 0; }
            .rsvp-content { padding: 25px 20px; }
        }
        
        /* Controls Bar */
        .controls-bar {
            position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%);
            background: rgba(20, 20, 20, 0.85); backdrop-filter: blur(5px); display: flex; gap: 15px;
            padding: 12px 24px; border-radius: 50px; box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            z-index: 1000; border: 1px solid rgba(255,255,255,0.2);
        }
        .controls-bar button {
            background: none; border: none; color: #f6f4ed; cursor: pointer; width: 45px; height: 45px;
            display: flex; align-items: center; justify-content: center; border-radius: 50%; transition: all 0.2s ease;
        }
        .controls-bar button svg { width: 28px; height: 28px; fill: currentColor; }

        .container::-webkit-scrollbar { width: 8px; height: 8px; }
        .container::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.3); border-radius: 4px; }

        @media (max-width: 768px) {
            .profile-title { font-size: 7vw; margin-bottom: 2em; }
            .profiles-container { flex-direction: column; gap: 8vw; }
            .controls-bar button { width: 40px; height: 40px; }
        }
    </style>
</head>
<body>

    <!-- AUDIO FILES -->
    <audio id="audio-common" src="assets/intro.mp3" preload="metadata"></audio>
    <audio id="audio-groom" src="assets/groom.mp3" preload="metadata"></audio>
    <audio id="audio-bride" src="assets/bride.mp3" preload="metadata"></audio>

    <div id="profile-screen" class="screen active">
        <h1 class="profile-title">Who's watching?</h1>
        <div class="profiles-container">
            <div class="profile" onclick="startExperience('Groom Side')">
                <div class="avatar groom"><svg viewBox="0 0 100 100"><circle cx="38" cy="42" r="5" fill="#fff"/><circle cx="78" cy="42" r="5" fill="#fff"/><path d="M 48 58 Q 65 72 82 52" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/></svg></div>
                <div class="profile-name">Groom Side</div>
            </div>
            
            <div class="profile" onclick="startExperience('Bride Side')">
                <div class="avatar bride"><svg viewBox="0 0 100 100"><circle cx="22" cy="42" r="5" fill="#fff"/><circle cx="62" cy="42" r="5" fill="#fff"/><path d="M 32 58 Q 49 72 66 52" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/></svg></div>

    <div id="flipbook-screen" class="screen">
        <div class="container" id="scroll-container">
            <div id="layout-wrapper">
                <div class="zoom-wrapper" id="zoom-wrapper">
                    
                    <div id="newspaper"></div>

                    <div id="flip-indicator">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7" /></svg>
                        <span>You Can Scroll Or Click Or Swipe</span>
                    </div>

                    <div id="video-play-overlay"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>

                </div>
            </div>

        <div class="controls-bar">
            <button id="btn-prev" title="Previous Page"><svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg></button>
            <button id="btn-zoom" title="Zoom In/Out"><svg id="icon-zoom-in" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/><path d="M12 10h-2v2H9v-2H7V9h2V7h1v2h2v1z"/></svg></button>
            <button id="btn-next" title="Next Page"><svg viewBox="0 0 24 24"><path d="M10.59 16.59L12 18l6-6-6-6-1.41 1.41L15.17 12z"/></svg></button>
        </div>
    </div>

    <!-- RSVP MODAL -->
    <div id="rsvp-modal">
        <div class="rsvp-content">
            <button class="close-rsvp" onclick="closeRSVP()">&#10005;</button>
            <h2>Wedding RSVP</h2>
            <form id="rsvp-form">
                <div class="form-group">
                    <label>Guest Name(s)</label>
                    <input type="text" id="rsvp-name" required placeholder="John & Jane Doe">
                </div>
                
                <div class="form-row">
                    <div class="form-group" style="flex: 1;"><label>Party Size</label><input type="number" id="rsvp-size" min="1" max="10" required value="1"></div>
                    <div class="form-group" style="flex: 2;"><label>City Travelling From</label><input type="text" id="rsvp-city" required placeholder="Delhi, Mumbai, etc."></div>
                </div>

                <div class="form-row">
                    <div class="form-group" style="flex: 1;"><label>Date of Arrival</label><input type="date" id="rsvp-arrival" required value="2026-10-16"></div>
                    <div class="form-group" style="flex: 1;"><label>Date of Departure</label><input type="date" id="rsvp-departure" required value="2026-10-19"></div>
                </div>
					  
                <div class="form-group">
                    <label>Meal Preference</label>
                    <div class="radio-group">
                        <label><input type="radio" name="meal" value="Veg" required> Vegetarian</label>
                        <label><input type="radio" name="meal" value="Non-Veg"> Non-Vegetarian</label>
                    </div>
                </div>
                
                <div class="checkbox-group">
                    <input type="checkbox" id="rsvp-alcohol" value="Yes">
                    <label for="rsvp-alcohol">We will be partaking in alcoholic beverages</label>
                </div>
															   
                <button type="submit" class="submit-btn" id="submit-btn">Send RSVP</button>
            </form>
        </div>
    </div>

    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz6pCPJuP2TwDmffHQ-l6T-2jGDJN7v-aIS6-g8p8FZ8lPz5ycmU3mWCoPPB_G-ML0_/exec";
        let flipbookInitialized = false, selectedSide = "", isZoomed = false;
        let activePageFlipInstance = null; 

        function updateScale() {
            const layout = document.getElementById('layout-wrapper');
            const wrapper = document.getElementById('zoom-wrapper');
            const container = document.getElementById('scroll-container');
            
            const isPortrait = window.innerWidth < 1200;
            const bookBaseWidth = isPortrait ? 700 : 1400; 
            const bookBaseHeight = 990;
            
            if (isPortrait) layout.classList.add('is-portrait');
            else layout.classList.remove('is-portrait');

            wrapper.style.width = `${bookBaseWidth}px`;
            wrapper.style.height = `${bookBaseHeight}px`;

            const paddingX = window.innerWidth < 768 ? 20 : 60; 
            const paddingY = window.innerWidth < 768 ? 100 : 140; 

            const scaleX = (window.innerWidth - paddingX) / bookBaseWidth;
            const scaleY = (window.innerHeight - paddingY) / bookBaseHeight;

            let baseScale = Math.min(scaleX, scaleY);
            if (baseScale > 1.8) baseScale = 1.8;

            const zoomMultiplier = window.innerWidth < 768 ? 2.5 : 1.8;
            const finalScale = isZoomed ? baseScale * zoomMultiplier : baseScale;
            
            wrapper.style.transform = `scale(${finalScale})`;
            layout.style.width = `${bookBaseWidth * finalScale}px`;
            layout.style.height = `${bookBaseHeight * finalScale}px`;

            const scaledHeight = bookBaseHeight * finalScale;
            if (isZoomed && scaledHeight >= window.innerHeight - paddingY / 2) {
                container.style.display = 'block';
                layout.style.marginTop = '40px'; 
                layout.style.marginBottom = '120px'; 
            } else {
                container.style.display = 'flex';
                container.style.alignItems = 'center';
                layout.style.marginTop = '0';
                layout.style.marginBottom = '0';
            }
        }

        window.addEventListener('resize', () => {
            if (flipbookInitialized) updateScale();
        });

        function startExperience(side) {
            selectedSide = side; 
            
            // Get the audio elements
            const commonAudio = document.getElementById('audio-common');
            const groomAudio = document.getElementById('audio-groom');
            const brideAudio = document.getElementById('audio-bride');

            // Set custom volumes (e.g., 0.3 for 30% volume, or 0.2 for 20%)
            commonAudio.volume = 0.3;
            groomAudio.volume = 0.3;
            brideAudio.volume = 0.3;

            // 1. Play the common intro clip immediately
            commonAudio.play().catch(e => console.log("Common audio error:", e));
            
            // 2. Wait 2 seconds, then play the specific Bride/Groom track
            setTimeout(() => {
                if (side === 'Groom Side') {
                    groomAudio.play().catch(e => console.log(e));
                } else if (side === 'Bride Side') {
                    brideAudio.play().catch(e => console.log(e));
                }
            }, 2000);

            // Screen transition logic...
            const profileScreen = document.getElementById('profile-screen');
            const flipbookScreen = document.getElementById('flipbook-screen');
            profileScreen.classList.remove('active');
            
            setTimeout(() => {
                profileScreen.style.display = 'none';
                flipbookScreen.style.display = 'flex';
                setTimeout(() => {
                    flipbookScreen.classList.add('active');
                    if (!flipbookInitialized) {
                        initFlipbook();
                        flipbookInitialized = true;
                    }
                }, 50);
            }, 800);
        }

        const rsvpModal = document.getElementById('rsvp-modal');
        const rsvpForm = document.getElementById('rsvp-form');
        const submitBtn = document.getElementById('submit-btn');
        function openRSVP() { rsvpModal.classList.add('active'); }
        function closeRSVP() { rsvpModal.classList.remove('active'); }

        rsvpForm.addEventListener('submit', function(e) {
            e.preventDefault();
            submitBtn.innerText = "Sending...";
            submitBtn.disabled = true;
            const formData = {
                side: selectedSide, name: document.getElementById('rsvp-name').value, partySize: document.getElementById('rsvp-size').value,
                city: document.getElementById('rsvp-city').value, arrival: document.getElementById('rsvp-arrival').value,
                departure: document.getElementById('rsvp-departure').value, meal: document.querySelector('input[name="meal"]:checked').value,
                alcohol: document.getElementById('rsvp-alcohol').checked ? "Yes" : "No"
            };
            fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: JSON.stringify(formData) })
            .then(response => {
                submitBtn.innerText = "Send RSVP"; submitBtn.disabled = false; rsvpForm.reset(); closeRSVP();
                let duration = 3 * 1000; let end = Date.now() + duration;
                (function frame() {
                    confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#ffc4a3', '#b0d892', '#ffffff', '#1a1a1a'] });
                    confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#ffc4a3', '#b0d892', '#ffffff', '#1a1a1a'] });
                    if (Date.now() < end) requestAnimationFrame(frame);
                }());
            })
            .catch(error => { alert("Error saving RSVP."); submitBtn.innerText = "Send RSVP"; submitBtn.disabled = false; });
        });

        function initFlipbook() {
            if (flipbookInitialized) return; // Prevent duplicate binding
			
            const newspaper = document.getElementById('newspaper');
            const scrollContainer = document.getElementById('scroll-container');
            const playOverlay = document.getElementById('video-play-overlay');
            const inlineVideoContainer = document.getElementById('inline-video-container');
            const weddingVideo = document.getElementById('wedding-video');
            const rsvpLinkOverlay = document.getElementById('rsvp-link-overlay');
            const flipIndicator = document.getElementById('flip-indicator');
            const btnPrev = document.getElementById('btn-prev');
            const btnNext = document.getElementById('btn-next');
            const btnZoom = document.getElementById('btn-zoom');
			
            const commonAudio = document.getElementById('audio-common');
            const groomAudio = document.getElementById('audio-groom');
            const brideAudio = document.getElementById('audio-bride');

            function pauseBackgroundMusic() {
                commonAudio.pause();
                groomAudio.pause();
                brideAudio.pause();
            }

            function resumeBackgroundMusic() {
                if (selectedSide === 'Groom Side' && groomAudio.paused) {
                    groomAudio.play().catch(e => console.log(e));
                } else if (selectedSide === 'Bride Side' && brideAudio.paused) {
                    brideAudio.play().catch(e => console.log(e));
                }
            }
			
			 // Automatically close video player when video finishes playing
            weddingVideo.addEventListener('ended', () => {
                inlineVideoContainer.classList.remove('playing');
                resumeBackgroundMusic();
                
                // Show play button again if user is still on the video page
                const isPortrait = activePageFlipInstance.getOrientation() === 'portrait';
                const videoPageIndex = isPortrait ? 5 : 4;
                if (activePageFlipInstance.getCurrentPageIndex() === videoPageIndex) {
                    playOverlay.classList.add('visible');
                }
            });
																			   
            activePageFlipInstance = new St.PageFlip(newspaper, {
                width: 700, height: 990, size: "fixed", showCover: false, 
                drawShadow: true, maxShadowOpacity: 0.5, usePortrait: true 
            });

            activePageFlipInstance.loadFromImages([
                'assets/bookmark.png', 'assets/page1.png', 'assets/page2.png', 
                'assets/page3.png', 'assets/page4.png', 'assets/video.png' 
            ]);

            updateScale(); 
            
            setTimeout(() => { flipIndicator.classList.add('visible'); }, 500);
            
             playOverlay.addEventListener('click', (e) => { 
                e.stopPropagation(); 
                playOverlay.classList.remove('visible'); 
                inlineVideoContainer.classList.add('playing'); 
                pauseBackgroundMusic();
                weddingVideo.play(); 
            });

            weddingVideo.addEventListener('play', pauseBackgroundMusic);
            weddingVideo.addEventListener('pause', resumeBackgroundMusic);
			
			// Stop click bubbling
            ['click', 'mousedown', 'pointerdown'].forEach(evt => {
                inlineVideoContainer.addEventListener(evt, (e) => e.stopPropagation());
                rsvpLinkOverlay.addEventListener(evt, (e) => e.stopPropagation());
            });
												
            activePageFlipInstance.on('flip', (e) => {
                flipIndicator.classList.remove('visible'); 
                
                const isPortrait = activePageFlipInstance.getOrientation() === 'portrait';
                const videoPageIndex = isPortrait ? 5 : 4;

                if (e.data === videoPageIndex) {
                    rsvpLinkOverlay.classList.add('visible'); 
                    if (weddingVideo.paused) playOverlay.classList.add('visible');
                } else {
                    playOverlay.classList.remove('visible');
                    rsvpLinkOverlay.classList.remove('visible'); 
                    inlineVideoContainer.classList.remove('playing');

                    if (!weddingVideo.paused) {
                        weddingVideo.pause();
                        resumeBackgroundMusic();
                    }
                }
            });

            btnPrev.addEventListener('click', () => activePageFlipInstance.flipPrev());
            btnNext.addEventListener('click', () => activePageFlipInstance.flipNext());
            btnZoom.addEventListener('click', () => {
                isZoomed = !isZoomed;
                updateScale(); 
                if (isZoomed) {
                    btnZoom.innerHTML = '<svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/><path d="M7 9h5v2H7z"/></svg>';
                } else {
                    btnZoom.innerHTML = '<svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/><path d="M12 10h-2v2H9v-2H7V9h2V7h1v2h2v1z"/></svg>';
                    setTimeout(() => scrollContainer.scrollTo({ top: 0, left: 0, behavior: 'smooth' }), 300);
                }
            });

            let isFlipping = false;
            scrollContainer.addEventListener('wheel', (e) => {
                if (isZoomed) return; e.preventDefault(); if (isFlipping) return;
                if (e.deltaY > 0) { activePageFlipInstance.flipNext(); isFlipping = true; }
                else if (e.deltaY < 0) { activePageFlipInstance.flipPrev(); isFlipping = true; }
                setTimeout(() => isFlipping = false, 600); 
            }, { passive: false });
			
			
            flipbookInitialized = true;
        }
    </script>
</body>
</html>
